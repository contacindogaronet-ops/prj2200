plugins { id 'com.android.application' }

android {
    namespace 'com.indogaro.net'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.indogaro.net"
        minSdk 24
        // 🔴 KUNCI ARSITEKTUR: Target SDK 28 adalah SYARAT MUTLAK (Hacks) 
        // untuk mengizinkan eksekusi biner dinamis tanpa akses ROOT.
        targetSdk 28 
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
