plugins { id 'com.android.application' }

android {
    namespace 'com.jargo.daemon'
    compileSdk 34

    // 🔴 KUNCI ARSITEKTUR: Penguncian Sidik Jari Statis
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.jargo.daemon"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
