name: KUL Daemon Compiler & OTA Releaser

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Memuat Kode Sumber
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Downgrade & Kunci Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    # 🔴 KUNCI ARSITEKTUR: HTML Scraper & Fallback Statis (Anti Rate-Limit)
    - name: 📦 Steal hev-socks5-tunnel from v2rayNG
      run: |
        mkdir -p android/app/src/main/jniLibs/arm64-v8a
        
        # Bypass API Limit dengan Scraping HTML murni
        LATEST_URI=$(curl -sL https://github.com/2dust/v2rayNG/releases/latest | grep -o 'href="/2dust/v2rayNG/releases/download/[^"]*arm64-v8a\.apk"' | head -n 1 | cut -d '"' -f 2)
        
        if [ -z "$LATEST_URI" ]; then
          echo "⚠️ HTML Scrape gagal (Rate Limit). Mengaktifkan jalur Fallback Darurat..."
          APK_URL="https://github.com/2dust/v2rayNG/releases/download/1.8.35/v2rayNG_1.8.35_arm64-v8a.apk"
        else
          APK_URL="https://github.com$LATEST_URI"
        fi
        
        echo "🚀 Mengekstraksi JNI Engine dari: $APK_URL"
        wget -q "$APK_URL" -O temp.apk
        unzip -q temp.apk lib/arm64-v8a/libhev-socks5-tunnel.so
        mv lib/arm64-v8a/libhev-socks5-tunnel.so android/app/src/main/jniLibs/arm64-v8a/
        rm -rf temp.apk lib/

    - name: 🔨 Kompilasi Mesin Indogo (APK)
      run: |
        cd android
        gradle assembleDebug

    - name: 📦 Distribusi Artefak
      if: startsWith(github.ref, 'refs/heads/main')
      uses: actions/upload-artifact@v4
      with:
        name: Indogo-App
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: 🏷️ Rename APK untuk OTA
      if: startsWith(github.ref, 'refs/tags/')
      run: mv android/app/build/outputs/apk/debug/app-debug.apk indogo-update.apk

    - name: 🚀 Otomatisasi GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: indogo-update.apk
        name: Indogo OTA Release ${{ github.ref_name }}
        body: "Enterprise L3 Tun2Socks Update (Anti Rate-Limit CI/CD)"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
