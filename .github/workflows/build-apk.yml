name: KUL Daemon Compiler

on:
  push:
    branches: [ "main" ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Memuat Kode Sumber
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Downgrade & Kunci Gradle (Anti-Crash Matrix)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: 🔨 Kompilasi Mesin Daemon (APK)
      run: |
        cd android
        gradle assembleDebug

    - name: 📦 Distribusi Artefak (APK)
      uses: actions/upload-artifact@v4
      with:
        name: Daemon-Manager-App
        path: android/app/build/outputs/apk/debug/app-debug.apk
