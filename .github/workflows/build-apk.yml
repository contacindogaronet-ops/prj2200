name: KUL Daemon Compiler & OTA Releaser

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Memuat Kode Sumber
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Downgrade & Kunci Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    # 🔴 KUNCI ARSITEKTUR: Pencurian JNI Library secara Dinamis dari API
    - name: 📦 Inject hev-socks5-tunnel (L3 TCP/UDP Engine)
      run: |
        mkdir -p android/app/src/main/jniLibs/arm64-v8a
        APK_URL=$(curl -sL https://api.github.com/repos/heiher/hev-socks5-tunnel-android/releases/latest | grep "browser_download_url" | grep "\.apk" | cut -d '"' -f 4 | head -n 1)
        wget -q $APK_URL -O tun2socks.zip
        unzip -q tun2socks.zip lib/arm64-v8a/libhev-socks5-tunnel.so
        mv lib/arm64-v8a/libhev-socks5-tunnel.so android/app/src/main/jniLibs/arm64-v8a/
        rm -rf tun2socks.zip lib/

    - name: 🔨 Kompilasi Mesin Indogo (APK)
      run: |
        cd android
        gradle assembleDebug

    - name: 📦 Distribusi Artefak
      if: startsWith(github.ref, 'refs/heads/main')
      uses: actions/upload-artifact@v4
      with:
        name: Indogo-App
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: 🏷️ Rename APK untuk OTA
      if: startsWith(github.ref, 'refs/tags/')
      run: mv android/app/build/outputs/apk/debug/app-debug.apk indogo-update.apk

    - name: 🚀 Otomatisasi GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: indogo-update.apk
        name: Indogo OTA Release ${{ github.ref_name }}
        body: "Enterprise L3 Tun2Socks Update (Full UDP/TCP/DoH Support)"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
