name: KUL Daemon Compiler & OTA Releaser

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Memuat Kode Sumber
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Downgrade & Kunci Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: 🔨 Kompilasi Mesin Indogo (APK)
      run: |
        cd android
        gradle assembleDebug

    - name: 📦 Distribusi Artefak (Untuk Push ke Main)
      if: startsWith(github.ref, 'refs/heads/main')
      uses: actions/upload-artifact@v4
      with:
        name: Indogo-App
        path: android/app/build/outputs/apk/debug/app-debug.apk

    - name: 🏷️ Rename APK untuk OTA
      if: startsWith(github.ref, 'refs/tags/')
      run: mv android/app/build/outputs/apk/debug/app-debug.apk indogo-update.apk

    - name: 🚀 Otomatisasi GitHub Release (Untuk Push Tag v*)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: indogo-update.apk
        name: Indogo OTA Release ${{ github.ref_name }}
        body: "Automated OTA update build for Indogo Daemon."
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
