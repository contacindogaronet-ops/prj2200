name: KUL Daemon Compiler & OTA Releaser

on:
  push:
    tags:
      - 'v*' # 🔴 Workflow INI HANYA MENYALA JIKA ANDA PUSH VERSI (Misal: git tag v4.0)

permissions:
  contents: write # Diperlukan untuk membuat Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Memuat Kode Sumber
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: ⚙️ Downgrade & Kunci Gradle (Anti-Crash Matrix)
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    - name: 🔨 Kompilasi Mesin Indogo (APK)
      run: |
        cd android
        gradle assembleDebug

    - name: 🏷️ Rename APK untuk OTA
      run: mv android/app/build/outputs/apk/debug/app-debug.apk indogo-update.apk

    - name: 🚀 Otomatisasi GitHub Release (OTA Backend)
      uses: softprops/action-gh-release@v1
      with:
        files: indogo-update.apk
        name: Indogo OTA Release ${{ github.ref_name }}
        body: "Automated OTA update build for Indogo Daemon."
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
